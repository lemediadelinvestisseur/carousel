name: Collecte des actus

on:
  schedule:
    # Toutes les 2 heures de 6h à 22h (heure de Paris, ~UTC+1)
    - cron: "7 5-21/2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collecte + notifications
        run: node scripts/collect.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          CLAUDE_CURATION_MODEL: ${{ vars.CLAUDE_CURATION_MODEL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      - name: Publication
        run: |
          ./scripts/publish.sh "actus: collecte $(date -u +%Y-%m-%dT%H:%M)"
