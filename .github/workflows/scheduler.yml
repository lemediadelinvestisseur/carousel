name: Horloge (collecte, LinkedIn, publications programmées)

# Tourne en permanence (se relance toutes les 5 h 30) et lance la collecte des actus, les propositions LinkedIn
# et les publications programmées à l'heure prévue. Les déclencheurs planifiés de GitHub ne sont qu'un secours :
# chacun redémarre l'horloge si elle s'est arrêtée.
run-name: "horloge"

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: scheduler
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Horloge
        run: node scripts/scheduler.mjs
        env:
          GH_TOKEN: ${{ github.token }}
