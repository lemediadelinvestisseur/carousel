name: Publication réseaux sociaux

run-name: "${{ inputs.mode }} ${{ inputs.id }}"

on:
  workflow_dispatch:
    inputs:
      id:
        description: "Identifiant du carousel (vide pour le mode connexion)"
        required: false
        default: ""
      mode:
        description: "connexion = vérifier les comptes, test = tout préparer sans publier, publier = publier pour de vrai"
        required: true
        default: "test"
        type: choice
        options: [connexion, test, publier]
      targets:
        description: "Où publier"
        required: false
        default: "instagram,facebook"
      force:
        description: "Republier même si déjà publié"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: social-${{ inputs.id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Publication
        run: node scripts/publish-social.mjs
        env:
          INPUT_ID: ${{ inputs.id }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_TARGETS: ${{ inputs.targets }}
          INPUT_FORCE: ${{ inputs.force }}
          META_PAGE_TOKEN_INVESTISSEUR: ${{ secrets.META_PAGE_TOKEN_INVESTISSEUR }}
          META_PAGE_TOKEN_21M2: ${{ secrets.META_PAGE_TOKEN_21M2 }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      - name: Enregistrement du statut
        if: always() && inputs.mode == 'publier'
        run: |
          ./scripts/publish.sh "publication: $INPUT_ID"
        env:
          INPUT_ID: ${{ inputs.id }}
