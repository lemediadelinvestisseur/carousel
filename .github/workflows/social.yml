name: Publication réseaux sociaux

run-name: "${{ github.event_name == 'schedule' && 'publications programmées' || format('{0} {1}', inputs.mode, inputs.id) }}"

on:
  # Publications programmées : vérification toutes les 10 minutes.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      id:
        description: "Identifiant du carousel (vide pour le mode connexion)"
        required: false
        default: ""
      mode:
        description: "connexion = vérifier les comptes, test = tout préparer sans publier, publier = publier maintenant, programmer = publier à l'heure indiquée, annuler = annuler la programmation"
        required: true
        default: "test"
        type: choice
        options: [connexion, test, publier, programmer, annuler]
      targets:
        description: "Où publier (instagram, facebook)"
        required: false
        default: "instagram,facebook"
      at:
        description: "Pour programmer : date et heure (ISO, ex. 2026-11-09T12:30:00+01:00)"
        required: false
        default: ""
      force:
        description: "Republier même si déjà publié"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  # Un groupe par carousel, et un pour le passage automatique : aucune demande n'en écrase une autre.
  group: social-${{ inputs.id || github.event_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODE: ${{ github.event_name == 'schedule' && 'echeances' || inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - name: Rien de programmé ?
        id: check
        run: |
          if [ "$MODE" = "echeances" ] && ! grep -qE '"scheduled": \{|"schedules": \[$' data/news.json data/linkedin.json 2>/dev/null; then
            echo "Aucune publication programmée."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.check.outputs.skip != 'true'
      - name: Publication
        id: pub
        if: steps.check.outputs.skip != 'true'
        run: node scripts/publish-social.mjs
        env:
          INPUT_ID: ${{ inputs.id }}
          INPUT_MODE: ${{ env.MODE }}
          INPUT_TARGETS: ${{ inputs.targets }}
          INPUT_AT: ${{ inputs.at }}
          INPUT_FORCE: ${{ inputs.force }}
          META_PAGE_TOKEN_INVESTISSEUR: ${{ secrets.META_PAGE_TOKEN_INVESTISSEUR }}
          META_PAGE_TOKEN_21M2: ${{ secrets.META_PAGE_TOKEN_21M2 }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      - name: Posts LinkedIn programmés
        if: always() && steps.check.outputs.skip != 'true' && env.MODE == 'echeances'
        run: node scripts/linkedin.mjs --mode echeances
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      - name: Enregistrement du statut
        if: always() && steps.check.outputs.skip != 'true' && contains(fromJSON('["publier","programmer","annuler","echeances","connexion"]'), env.MODE)
        run: |
          ./scripts/publish.sh "publication: $MODE $INPUT_ID"
        env:
          INPUT_ID: ${{ inputs.id }}
